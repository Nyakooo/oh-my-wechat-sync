[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-archive"
version = "0.1.0"
description = "Import-first self-hosted WeChat archive core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["archive_core*", "backend*"]
